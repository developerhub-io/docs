<script>
document.addEventListener('oncardschanged', function (event) {
  const cardsContainer = document.querySelector('#landing-cards');
  event.detail.docs.forEach((card) => {
    const cardDiv = document.createElement('DIV');
    cardDiv.classList.add('landing-card', 'docs-card');
    cardDiv.addEventListener('mouseenter', ev => {cardDiv.classList.add('show-hovered')});
    cardDiv.addEventListener('mouseleave', ev => {cardDiv.classList.remove('show-hovered')});

    const titleAnchor = document.createElement('A');
    titleAnchor.classList.add('clickable');
    const h4CardTitle = document.createElement('H4');
    h4CardTitle.classList.add(['title']);
    h4CardTitle.innerText = card.title;
    titleAnchor.href = card.link;
    titleAnchor.appendChild(h4CardTitle);
    cardDiv.appendChild(titleAnchor);

    card.details.forEach((cPage) => {
      const aLink = document.createElement('A');
      aLink.classList.add('d-block', 'link', 'clickable');
      aLink.href = cPage.link;
      aLink.innerText = cPage.title;
      cardDiv.appendChild(aLink);
    });

    rowSeparator = document.createElement('DIV');
    rowSeparator.classList.add('col-xs-12', 'col-sm-6', 'col-lg-6');
    rowSeparator.appendChild(cardDiv);

    const showAllA = document.createElement('A');
    showAllA.href = card.link;
    const showAllDiv = document.createElement('DIV');
    showAllDiv.classList.add('show-all');
    showAllDiv.innerHTML = 'Show all<i class="fas fa-chevron-right"></i>';
    showAllA.appendChild(showAllDiv);
    cardDiv.appendChild(showAllA);

    cardsContainer.appendChild(rowSeparator);
  });
  window.applyClickHandlersOnLinks();
});
</script>

 <style>
  .changelog-actions { flex-wrap: wrap; justify-content: flex-end; }
  .changelog-actions > .changelog-btn { white-space: nowrap; }
  a.changelog-btn.dh-linkedin-follow { display: inline-flex; align-items: center; gap: 6px; line-height: normal; color: inherit; }
  a.changelog-btn.dh-linkedin-follow:hover { color: inherit; text-decoration: none; }
  a.changelog-btn.dh-linkedin-follow i { color: #0a66c2; font-size: 15px; }
  body.dark-mode a.changelog-btn.dh-linkedin-follow i { color: #70b5f9; }
</style>
<script>
  (function () {
    var LINKEDIN_URL = 'https://www.linkedin.com/company/developer-hub';
    var LABEL = 'Follow us for latest updates';

    function ensureButton() {
      var actions = document.querySelector('.changelog-actions');
      if (!actions || actions.querySelector('.dh-linkedin-follow')) {
        return;
      }
      var rss = actions.querySelector('.changelog-btn.rss');
      var btn = document.createElement('a');
      btn.className = 'changelog-btn dh-linkedin-follow';
      btn.href = LINKEDIN_URL;
      btn.target = '_blank';
      btn.rel = 'noopener';
      btn.innerHTML = '<i class="fab fa-linkedin"></i><span></span>';
      btn.lastChild.textContent = LABEL;
      // Borrow the changelog's scoped style attribute so the button matches the RSS button.
      if (rss) {
        for (var i = 0; i < rss.attributes.length; i++) {
          if (rss.attributes[i].name.indexOf('_ngcontent') === 0) {
            btn.setAttribute(rss.attributes[i].name, '');
          }
        }
      }
      actions.insertBefore(btn, rss || null);
    }

    // The changelog renders after the section changes, so watch for its header while the
    // changelog is open, and put the button back if the header is ever rendered again.
    var observer = null;

    function watch() {
      ensureButton();
      if (!observer) {
        observer = new MutationObserver(ensureButton);
        observer.observe(document.body, { childList: true, subtree: true });
      }
    }

    function unwatch() {
      if (observer) {
        observer.disconnect();
        observer = null;
      }
    }

    document.addEventListener('onsectionchange', function (e) {
      if (e.detail && e.detail.type === 'changelog') {
        watch();
      } else {
        unwatch();
      }
    });

    // First load straight onto the changelog can fire the event before this script runs.
    function checkCurrent() {
      var section = window.getActiveSection && window.getActiveSection();
      if (section && section.type === 'changelog') {
        watch();
      }
    }
    document.addEventListener('onprojectloaded', checkCurrent);
    checkCurrent();
  })();
</script>
